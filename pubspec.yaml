name: business_card_app
description: "Business Card App (Flutter + Laravel API)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # =============================
  # UI
  # =============================
  cupertino_icons: ^1.0.8

  # =============================
  # STATE MANAGEMENT
  # =============================
  provider: ^6.1.2
  flutter_riverpod: ^2.3.0

  # =============================
  # NETWORKING
  # =============================
  dio: ^5.4.3
  retrofit: ^4.1.0
  json_annotation: ^4.9.0
  url_launcher: ^6.2.5

  # =============================
  # STORAGE (TOKEN)
  # =============================
  flutter_secure_storage: ^9.0.0

  # =============================
  # PUSH NOTIFICATIONS
  # =============================
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # =============================
  # UTILS
  # =============================
  intl: ^0.19.0
  image_picker: ^1.1.2
  mobile_scanner: ^5.2.3
  # On-device OCR for scanning a physical business card into form fields.
  google_mlkit_text_recognition: ^0.15.0
  qr_flutter: ^4.1.0
  flutter_dotenv: ^5.1.0
  google_fonts: ^6.2.1
  lottie: ^3.1.3
  # Saves images (QR code, card photos) to the phone's photo gallery.
  # Pinned (not ^2.3.0): 2.3.3 switched android/build.gradle to
  # `compileSdk flutter.compileSdkVersion`, which this project's Gradle
  # setup fails to resolve ("unknown property 'flutter'"). 2.3.0 still
  # hardcodes `compileSdk 34` and has the same Dart API we use.
  gal: 2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # =============================
  # CODE GENERATION
  # =============================
  build_runner: ^2.4.8
  retrofit_generator: ^8.1.0
  json_serializable: ^6.8.0

  # =============================
  # APP ICON
  # =============================
  flutter_launcher_icons: ^0.13.1

# =============================
# FLUTTER CONFIG
# =============================
flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/images/ABW.png
    - assets/images/login.png
    - assets/images/businessCard4U.png

# =============================
# LAUNCHER ICON CONFIG
# =============================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/businessCard4U.png"
